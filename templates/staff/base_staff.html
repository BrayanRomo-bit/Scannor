{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Mando | ScannorQA MLOps</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #111827;
            --bg-panel: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #6366f1; /* Índigo para diferenciar del verde del cliente */
            --accent-hover: #4f46e5;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { display: flex; height: 100vh; background-color: #f3f4f6; overflow: hidden; }

        /* SIDEBAR OSCURO */
        .sidebar {
            width: 260px; background-color: var(--bg-dark); color: var(--text-main);
            display: flex; flex-direction: column; padding: 20px 0; box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 1px solid #374151; margin-bottom: 20px; }
        .sidebar-header h2 { font-size: 18px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .badge-staff { background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; letter-spacing: 1px;}

        .nav-link {
            display: flex; align-items: center; padding: 12px 20px; color: var(--text-muted);
            text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.2s; gap: 12px;
        }
        .nav-link:hover, .nav-link.active { background-color: var(--bg-panel); color: #fff; border-left: 4px solid var(--accent); }
        .nav-link svg { width: 18px; height: 18px; }

        /* ÁREA DE CONTENIDO */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        
        .topbar { background: white; padding: 15px 30px; display: flex; justify-content: flex-end; align-items: center; border-bottom: 1px solid #e5e7eb; }
        .user-profile { font-size: 13px; font-weight: 600; color: #374151; display: flex; align-items: center; gap: 15px;}
        .btn-logout { background: #fee2e2; color: #dc2626; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; }

        .content-wrapper { padding: 30px; }
        
        /* ESTILOS COMUNES PARA TABLAS DEL STAFF */
        .staff-card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 25px; margin-bottom: 20px; }
        .staff-card h3 { margin-bottom: 15px; color: #111827; font-size: 18px; }
        
        .staff-table { width: 100%; border-collapse: collapse; }
        .staff-table th, .staff-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
        .staff-table th { background-color: #f9fafb; color: #6b7280; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;}
        
        .form-control { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
        .btn-primary { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background: var(--accent-hover); }
    </style>
</head>
<body>

    <!-- MENÚ LATERAL (Solo lo ves tú) -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>ScannorQA <span class="badge-staff">STAFF</span></h2>
            <p style="font-size: 11px; color: #6b7280; margin-top: 5px;">Centro de Mando MLOps</p>
        </div>

        <a href="{% url 'staff_empresas' %}" class="nav-link {% if request.resolver_match.url_name == 'staff_empresas' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 7v14M21 7v14M6 21V3h12v18M9 7h6M9 11h6M9 15h6"/></svg>
            Fábricas (Clientes)
        </a>

        <a href="{% url 'staff_usuarios' %}" class="nav-link {% if request.resolver_match.url_name == 'staff_usuarios' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Usuarios y Operadores
        </a>

        <a href="{% url 'staff_dispositivos' %}" class="nav-link {% if request.resolver_match.url_name == 'staff_dispositivos' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><path d="M12 8v8M8 12h8"/></svg>
            Dispositivos Edge
        </a>

        <a href="#" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            Modelos IA (.pt)
        </a>
    </nav>

    <!-- ÁREA DE TRABAJO DERECHA -->
    <div class="main-content">
        <header class="topbar">
            <div class="user-profile">
                Hola, {{ user.username }} (Ingeniero Principal)
                <a href="#" class="btn-logout">Cerrar Sesión</a>
            </div>
        </header>

        <main class="content-wrapper">
            <!-- AQUÍ SE INYECTARÁ EL CÓDIGO DE LAS OTRAS PANTALLAS -->
            {% block content %}
            {% endblock %}
        </main>
    </div>

</body>
</html>
